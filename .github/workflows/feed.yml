name: Generate Static

env:
  # Override with a repository variable when GitHub Pages uses a custom domain.
  FEED_BASE_URL: ${{ vars.FEED_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch published feeds
        run: |
          git fetch --depth=5 origin gh-pages:refs/remotes/origin/gh-pages || true
          mkdir previous
          git show-ref --verify --quiet refs/remotes/origin/gh-pages && git archive origin/gh-pages | tar -x -C previous || true
      - uses: pnpm/setup@v2
        with:
          version: latest
          runtime: node@24
          install: false
          cache: true
      - id: playwright
        run: node -p "'version=' + require('./package.json').dependencies.playwright" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - id: generate
        name: Generate feeds
        run: |
          set -o pipefail
          PUBLISHED_FEED_DIRECTORY=previous pnpm run generate 2>&1 | tee /tmp/feed-generation.log
          sed -r 's/\x1B\[[0-?]*[ -/]*[@-~]//g' /tmp/feed-generation.log > /tmp/feed-summary.log
          {
            echo "## Feed generation"
            echo '```text'
            cat /tmp/feed-summary.log
            echo '```'
            if grep -q ' ERROR:' /tmp/feed-summary.log; then
              echo '### Errors'
              echo '> [!CAUTION]'
              grep ' ERROR:' /tmp/feed-summary.log | while IFS= read -r error; do
                printf '> %s\n' "$error"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s public/changed-feeds.txt ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
          if [ -s public/changed-feeds.txt ] || [ -s public/state-changed.txt ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish feeds and pending state
        if: steps.generate.outputs.publish == 'true'
        run: |
          export GIT_AUTHOR_NAME=github-actions[bot]
          export GIT_AUTHOR_EMAIL=41898282+github-actions[bot]@users.noreply.github.com
          export GIT_COMMITTER_NAME=$GIT_AUTHOR_NAME
          export GIT_COMMITTER_EMAIL=$GIT_AUTHOR_EMAIL
          pages=$(mktemp -d)
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add --detach "$pages" origin/gh-pages
          else
            git worktree add --detach "$pages" HEAD
            git -C "$pages" checkout --orphan gh-pages
            git -C "$pages" rm -rf .
          fi
          rsync -a --checksum --delete --exclude=.git public/ "$pages/"
          git -C "$pages" add -A
          git -C "$pages" -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot] commit -m 'Publish feeds'

          parent=
          if git -C "$pages" rev-parse --verify --quiet HEAD^; then
            while IFS= read -r commit; do
              tree=$(git -C "$pages" rev-parse "$commit^{tree}")
              if [ -n "$parent" ]; then
                parent=$(git -C "$pages" log -1 --format=%B "$commit" | git -C "$pages" commit-tree "$tree" -p "$parent")
              else
                parent=$(git -C "$pages" log -1 --format=%B "$commit" | git -C "$pages" commit-tree "$tree")
              fi
            done < <(git -C "$pages" rev-list --reverse --max-count=4 HEAD^)
          fi
          tree=$(git -C "$pages" rev-parse HEAD^{tree})
          if [ -n "$parent" ]; then
            head=$(printf 'Publish feeds\n' | git -C "$pages" commit-tree "$tree" -p "$parent")
          else
            head=$(printf 'Publish feeds\n' | git -C "$pages" commit-tree "$tree")
          fi
          git -C "$pages" update-ref refs/heads/gh-pages "$head"
          git -C "$pages" push --force origin refs/heads/gh-pages:gh-pages
      - name: Notify WebSub hub
        if: steps.generate.outputs.changed == 'true'
        run: |
          while IFS= read -r feed; do
            feed_url="${FEED_BASE_URL%/}/$feed"
            echo "Notifying WebSub hub: $feed_url"
            curl --fail --retry 3 --retry-all-errors --silent --show-error --write-out '\nWebSub response: %{http_code}\n' -X POST https://pubsubhubbub.superfeedr.com/ \
              --data-urlencode 'hub.mode=publish' \
              --data-urlencode "hub.url=$feed_url"
          done < public/changed-feeds.txt
